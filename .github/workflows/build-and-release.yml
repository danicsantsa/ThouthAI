name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 libxcb-cursor0 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Verify LFS files were pulled correctly
        run: |
          for f in efficientdet.tflite face_landmarker.task hand_landmarker.task pose_landmarker_lite.task; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $f looks like an LFS pointer, not the real file!"
              exit 1
            fi
          done

      - name: Build installer
        run: python build/build.py

      - name: Archive onedir build
        run: |
          cd dist
          tar -czf Atum-linux-x86_64.tar.gz Atum/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atum-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/Atum-linux-x86_64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/atum-linux/*.deb
            artifacts/atum-linux/*.AppImage
            artifacts/atum-linux/Atum-linux-x86_64.tar.gz
          generate_release_notes: true