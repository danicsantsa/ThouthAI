name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:   # manueller Testlauf ohne Release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: atum-linux
          - os: windows-latest
            artifact_name: atum-windows
          - os: macos-latest
            artifact_name: atum-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            dpkg-dev

      - name: Install appimagetool (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Verify LFS files were pulled correctly
        shell: bash
        run: |
          for f in efficientdet.tflite face_landmarker.task hand_landmarker.task pose_landmarker_lite.task; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing"; exit 1
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $f looks like an LFS pointer, not the real file!"; exit 1
            fi
          done

      - name: Build installer
        run: python build/build.py
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Archive onedir build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czf Atum-linux-x86_64.tar.gz Atum/

      - name: Archive onedir build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd dist
          if (Test-Path Atum) {
            Compress-Archive -Path Atum -DestinationPath Atum-windows-x86_64.zip
          }

      - name: Archive onedir build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          ARCH=$(uname -m)
          if [ -d "Atum.app" ]; then
            zip -r -y "Atum-macos-$ARCH.zip" Atum.app
          elif [ -d "Atum" ]; then
            zip -r -y "Atum-macos-$ARCH.zip" Atum
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.exe
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/atum-linux/*.deb
            artifacts/atum-linux/*.AppImage
            artifacts/atum-linux/Atum-linux-x86_64.tar.gz
            artifacts/atum-windows/*.exe
            artifacts/atum-windows/Atum-windows-x86_64.zip
            artifacts/atum-macos/*.dmg
            artifacts/atum-macos/Atum-macos-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true